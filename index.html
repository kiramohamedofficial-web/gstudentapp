<style>
  /* =================================================================
     GLOBAL DESIGN SYSTEM V5.0 - Advanced Customization & Neon Engine
     ================================================================= */

  /* Base & Default Theme (Dark) */
  :root, [data-theme="dark"] {
    --font-family-sans: 'Tajawal', 'Cairo', sans-serif;
    --bg-primary: #1a1c22; --bg-primary-rgb: 26, 28, 34;
    --bg-secondary: #22252d; --bg-secondary-rgb: 34, 37, 45;
    --bg-tertiary: #2e323d;
    --border-primary: rgba(255, 255, 255, 0.1);
    --border-secondary: rgba(255, 255, 255, 0.18);
    --text-primary: #e2e4e7;
    --text-secondary: #adb1b8;
    --text-accent: #7094e2;
    --accent-primary: #7094e2; --accent-primary-rgb: 112, 148, 226;
    --accent-secondary: #8fadde;
    --accent-gradient: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
    --glass-bg: rgba(34, 37, 45, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-blur: 16px;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.1);
    --shadow-md: 0 4px 15px 0 rgba(0,0,0,0.2);
    --shadow-lg: 0 10px 40px 0 rgba(0,0,0,0.35);
    --shadow-color: rgba(0, 0, 0, 0.5);
    --shadow-glow: 0 0 25px rgba(var(--accent-primary-rgb), 0.25);

    /* Neon Vars */
    --neon-color: #00ffff;
    --neon-intensity: 0.5; /* 0 to 1 */
  }

  /* Light Theme */
  [data-theme="light"] {
    --bg-primary: #f9fafb; --bg-primary-rgb: 249, 250, 251;
    --bg-secondary: #ffffff; --bg-secondary-rgb: 255, 255, 255;
    --bg-tertiary: #eef0f2;
    --border-primary: rgba(0, 0, 0, 0.08);
    --border-secondary: rgba(0, 0, 0, 0.15);
    --text-primary: #333b47;
    --text-secondary: #5c636e;
    --text-accent: #3366cc;
    --accent-primary: #3366cc; --accent-primary-rgb: 51, 102, 204;
    --accent-secondary: #668cdd;
    --accent-gradient: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
    --glass-bg: rgba(240, 245, 255, 0.75);
    --glass-border: rgba(51, 102, 204, 0.1);
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
    --shadow-md: 0 4px 12px 0 rgb(0 0 0 / 0.08);
    --shadow-lg: 0 12px 24px 0 rgb(0 0 0 / 0.1);
    --shadow-color: rgba(0, 0, 0, 0.15);
    --shadow-glow: 0 0 20px rgba(var(--accent-primary-rgb), 0.15);
  }

  /* .Clymorphism Light Theme */
  [data-theme=".clymorphism-light"] {
    --clay-bg-main: #E6E7ED;
    --clay-bg-element: #F0F0F3;
    --clay-shadow-outer: rgba(174, 174, 192, 0.5);
    --clay-shadow-inner-light: rgba(255, 255, 255, 1);
    --clay-shadow-inner-dark: rgba(209, 205, 199, 0.5);
    --accent-primary: #8a3ffc; --accent-primary-rgb: 138, 63, 252;
    --accent-secondary: #a78bfa;
    --bg-primary: var(--clay-bg-main);
    --bg-secondary: var(--clay-bg-element);
    --bg-tertiary: #E8E6F0;
    --border-primary: rgba(0, 0, 0, 0.05);
    --border-secondary: rgba(0, 0, 0, 0.1);
    --text-primary: #2d2a3a;
    --text-secondary: #5c5965;
    --text-accent: var(--accent-primary);
    --accent-gradient: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
    --glass-bg: transparent; --glass-border: transparent; --glass-blur: 0px;
    --shadow-md: none; --shadow-lg: none;
  }

  /* .Clymorphism Dark Theme */
  [data-theme=".clymorphism-dark"] {
    --clay-bg-main: #252330;
    --clay-bg-element: #2d2a3a;
    --clay-shadow-outer: rgba(0, 0, 0, 0.5);
    --clay-shadow-inner-light: rgba(60, 55, 80, 0.8);
    --clay-shadow-inner-dark: rgba(10, 5, 20, 0.5);
    --accent-primary: #9f7aea; --accent-primary-rgb: 159, 122, 234;
    --accent-secondary: #a78bfa;
    --bg-primary: var(--clay-bg-main);
    --bg-secondary: var(--clay-bg-element);
    --bg-tertiary: #3a364a;
    --border-primary: rgba(255, 255, 255, 0.1);
    --border-secondary: rgba(255, 255, 255, 0.15);
    --text-primary: #f2efff;
    --text-secondary: #a09cb8;
    --text-accent: var(--accent-primary);
    --accent-gradient: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
    --glass-bg: transparent; --glass-border: transparent; --glass-blur: 0px;
    --shadow-md: none; --shadow-lg: none;
  }

  /* .Clymorphism Base Styles */
  [data-theme^=".clymorphism"] body {
    background: var(--clay-bg-main);
  }

  [data-theme^=".clymorphism"] .app-header,
  [data-theme^=".clymorphism"] .student-bottom-nav,
  [data-theme^=".clymorphism"] .home-card,
  [data-theme^=".clymorphism"] .stat-card,
  [data-theme^=".clymorphism"] .feature-card {
    background: var(--clay-bg-element);
    border-radius: 20px;
    backdrop-filter: none;
    background-color: var(--clay-bg-element);
    transition: all 0.3s ease;
  }

  [data-theme=".clymorphism-light"] .app-header,
  [data-theme=".clymorphism-light"] .student-bottom-nav,
  [data-theme=".clymorphism-light"] .home-card,
  [data-theme=".clymorphism-light"] .stat-card,
  [data-theme=".clymorphism-light"] .feature-card {
    box-shadow: 10px 10px 20px var(--clay-shadow-outer), 
                inset -4px -4px 8px var(--clay-shadow-inner-light),
                inset 3px 3px 5px var(--clay-shadow-inner-dark);
    border: 1px solid rgba(255, 255, 255, 0.5);
  }

  [data-theme=".clymorphism-dark"] .app-header,
  [data-theme=".clymorphism-dark"] .student-bottom-nav,
  [data-theme=".clymorphism-dark"] .home-card,
  [data-theme=".clymorphism-dark"] .stat-card,
  [data-theme=".clymorphism-dark"] .feature-card {
    box-shadow: 10px 10px 20px var(--clay-shadow-outer), 
                inset -4px -4px 8px var(--clay-shadow-inner-dark),
                inset 4px 4px 8px var(--clay-shadow-inner-light);
    border: 1px solid rgba(0, 0, 0, 0.2);
  }
  
  /* .Clymorphism Sidebar Elements */
  [data-theme^=".clymorphism"] aside {
    background: transparent;
  }
  [data-theme^=".clymorphism"] .clay-element {
    background-color: var(--clay-bg-element);
    border-radius: 12px;
    transition: all 0.2s ease-in-out;
  }
  [data-theme=".clymorphism-light"] .clay-outset {
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 4px 4px 8px var(--clay-shadow-outer), 
                inset -2px -2px 5px var(--clay-shadow-inner-light),
                inset 2px 2px 4px var(--clay-shadow-inner-dark);
  }
  [data-theme=".clymorphism-light"] .clay-inset {
    box-shadow: inset 2px 2px 5px var(--clay-shadow-inner-dark), 
                inset -3px -3px 7px var(--clay-shadow-inner-light);
  }
  [data-theme=".clymorphism-dark"] .clay-outset {
    border: 1px solid rgba(0, 0, 0, 0.2);
    box-shadow: 4px 4px 8px var(--clay-shadow-outer), 
                inset -3px -3px 6px var(--clay-shadow-inner-dark),
                inset 3px 3px 6px var(--clay-shadow-inner-light);
  }
  [data-theme=".clymorphism-dark"] .clay-inset {
      box-shadow: inset 3px 3px 6px var(--clay-shadow-inner-dark), 
                  inset -3px -3px 6px var(--clay-shadow-inner-light);
  }

  /* Modal styling */
  [data-theme^=".clymorphism"] .fixed.inset-0.z-50 {
      backdrop-filter: none;
      background: rgba(var(--bg-primary-rgb), 0.7);
  }
  [data-theme^=".clymorphism"] .fixed.inset-0.z-50 > div[class*="max-w-"] {
      background: var(--clay-bg-element);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: none !important;
  }

  [data-theme=".clymorphism-light"] .fixed.inset-0.z-50 > div[class*="max-w-"] {
      box-shadow: 10px 10px 30px var(--clay-shadow-outer);
  }
  [data-theme=".clymorphism-dark"] .fixed.inset-0.z-50 > div[class*="max-w-"] {
      box-shadow: 10px 10px 30px var(--clay-shadow-outer);
      border: 1px solid rgba(0, 0, 0, 0.2);
  }
  
  /* NEON ENGINE */
  [data-neon-enabled="true"] .neon-glow {
    box-shadow: 
      0 0 calc(var(--neon-intensity) * 8px) var(--neon-color),
      0 0 calc(var(--neon-intensity) * 20px) var(--neon-color),
      0 0 calc(var(--neon-intensity) * 30px) var(--neon-color);
  }
  [data-neon-enabled="true"] .neon-border {
    border: 2px solid var(--neon-color);
    box-shadow: 
      inset 0 0 calc(var(--neon-intensity) * 5px) var(--neon-color),
      0 0 calc(var(--neon-intensity) * 8px) var(--neon-color);
  }
  [data-neon-enabled="true"] .neon-text {
    color: var(--neon-color);
    text-shadow: 0 0 calc(var(--neon-intensity) * 10px) var(--neon-color);
  }

  body {
    font-family: var(--font-family-sans);
    background-color: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  
  /* General UI Polish & Transitions */
  button,
  a,
  [role="button"] {
    transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:not(:disabled):active,
  [role="button"]:not([aria-disabled="true"]):active,
  a:active {
    transform: scale(0.97);
    transition-duration: 0.05s;
  }
  
  input, select, textarea {
      transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, background-color 0.2s ease;
  }
  
  /* Animations */
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
  }
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }
  @keyframes pulse-effect {
    0% { box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0.5), 0 10px 20px -10px rgba(var(--accent-primary-rgb),0.4); }
    70% { box-shadow: 0 0 0 20px rgba(var(--accent-primary-rgb), 0), 0 15px 30px -10px rgba(var(--accent-primary-rgb),0.4); }
    100% { box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0), 0 10px 20px -10px rgba(var(--accent-primary-rgb),0.4); }
  }
  @keyframes gradient-animation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .animate-blob { animation: blob 10s infinite; }
  .animation-delay-4000 { animation-delay: -4s; }
  .fade-in { animation: fade-in-up 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; opacity: 0; }
  .fade-in-delay-1 { animation-delay: 0.1s; }
  .fade-in-delay-2 { animation-delay: 0.2s; }
  .fade-in-delay-3 { animation-delay: 0.3s; }
  .fade-in-delay-4 { animation-delay: 0.4s; }
  .animate-float { animation: float 6s ease-in-out infinite; }
  .pulse-btn { animation: pulse-effect 2.5s infinite; }

  /* New Loader */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .simple-loader {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 4px solid var(--border-primary);
    border-top-color: var(--accent-primary);
    animation: spin 1s linear infinite;
  }

  /* Toast Notifications */
  .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
  }
  @keyframes slide-in-right {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
  }
  .toast-item {
      width: 100%;
      max-width: 24rem; /* 384px */
      padding: 1rem 1.25rem;
      border-radius: 0.75rem; /* Slightly larger radius */
      box-shadow: var(--shadow-lg);
      animation: slide-in-right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
  }

  /* Mobile Sidebar Animation */
  @keyframes slide-in-right-panel {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  .animate-slide-in-right {
    animation: slide-in-right-panel 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes fade-in-backdrop {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .animate-fade-in {
    animation: fade-in-backdrop 0.3s ease-out forwards;
  }

  /* Theme Toggle Animation */
  .theme-toggle-icons {
    position: relative;
    width: 20px; /* Corresponds to w-5 */
    height: 20px; /* Corresponds to h-5 */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle-icons svg {
    position: absolute;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
  }
  /* When dark mode is active */
  html[data-theme*="dark"] .sun-icon {
    transform: rotate(90deg) scale(0.5);
    opacity: 0;
  }
  html[data-theme*="dark"] .moon-icon {
    transform: rotate(0) scale(1);
    opacity: 1;
  }
  /* When light mode is active */
  html[data-theme*="light"] .sun-icon {
    transform: rotate(0) scale(1);
    opacity: 1;
  }
  html[data-theme*="light"] .moon-icon {
    transform: rotate(-90deg) scale(0.5);
    opacity: 0;
  }

  /* Refined Nav Button Styles */
  .nav-btn {
      transition: background-color 0.2s, color 0.2s, transform 0.2s;
      font-weight: 500;
  }
  .nav-btn.active {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      font-weight: 700;
  }
  .nav-btn.active .nav-icon { color: var(--accent-primary); }
  .nav-btn.admin.active .nav-icon { color: #A855F7; /* purple-500 */ }
  
  /* Clymorphism Nav Button Styles */
  [data-theme^=".clymorphism"] .nav-btn {
    background-color: transparent !important;
    color: var(--text-secondary);
  }
  [data-theme^=".clymorphism"] .nav-btn.active,
  [data-theme^=".clymorphism"] .clay-inset {
    color: var(--text-primary);
    font-weight: 700;
  }
  [data-theme^=".clymorphism"] .bottom-nav-item.active {
    border-radius: 12px;
    background-color: transparent !important;
  }
  [data-theme=".clymorphism-light"] .bottom-nav-item.active {
     box-shadow: inset 1px 1px 3px var(--clay-shadow-inner-dark), 
                  inset -2px -2px 4px var(--clay-shadow-inner-light);
  }
  [data-theme=".clymorphism-dark"] .bottom-nav-item.active {
     box-shadow: inset 2px 2px 4px var(--clay-shadow-inner-dark), 
                inset -2px -2px 4px var(--clay-shadow-inner-light);
  }


  /* Gradient Text */
  .gradient-text {
    background-image: var(--accent-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  
  /* Cosmic Background & Welcome Page styles */
  .cosmic-flow-background {
    background: linear-gradient(-45deg, #0A0E14, #12161F, #0A0E14, #1A1F2A);
    background-size: 400% 400%;
    animation: gradient-animation 35s ease infinite;
    overflow: hidden;
  }
  .waves-container {
      position: relative;
      width: 100%;
      height: 15vh;
      margin-bottom: -7px;
      min-height: 100px;
      max-height: 150px;
  }
  .waves-parallax > use {
      animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
  }
  .waves-parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; fill: rgba(var(--bg-secondary-rgb), 0.7); }
  .waves-parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; fill: rgba(var(--bg-secondary-rgb), 0.5); }
  .waves-parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; fill: rgba(var(--bg-secondary-rgb), 0.3); }
  .waves-parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; fill: rgb(var(--bg-secondary-rgb)); }
  @keyframes move-forever {
      0% { transform: translate3d(-90px,0,0); }
      100% { transform: translate3d(85px,0,0); }
  }
  .stat-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    transition: all 0.3s ease-in-out;
  }
  .stat-card:hover {
      transform: translateY(-5px);
      border-color: rgba(var(--accent-primary-rgb), 0.7);
      box-shadow: var(--shadow-glow);
  }
  .stat-number { background-image: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat-icon { color: var(--text-secondary); transition: color 0.3s ease-in-out; }
  .stat-card:hover .stat-icon { color: var(--accent-primary); }
  .feature-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease-in-out;
  }
  .feature-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(var(--accent-primary-rgb), 0.6);
      box-shadow: 0 15px 30px rgba(0,0,0,0.2), var(--shadow-glow);
  }
  .feature-icon-wrapper { background: rgba(var(--bg-primary-rgb), 0.5); border: 1px solid var(--glass-border); }
  .feature-image { transition: transform 0.3s ease-in-out; }
  .feature-card:hover .feature-image { transform: scale(1.05); }
  .card-waves-container {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 45%;
      opacity: 0.8;
  }
  .card-waves-parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
  .card-waves-parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; fill: rgba(255, 255, 255, 0.1); }
  .card-waves-parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; fill: rgba(255, 255, 255, 0.07); }
  .card-waves-parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; fill: rgba(255, 255, 255, 0.05); }
  .card-waves-parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; fill: rgba(255, 255, 255, 0.03); }
  .plus-pattern {
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 10px 10px;
  }

  /* Home Screen & General UI cards */
  .home-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    transition: all 0.3s ease;
  }
  .home-card:hover {
    transform: translateY(-4px);
    border-color: rgba(var(--accent-primary-rgb), 0.5);
    box-shadow: var(--shadow-glow);
  }

  /* Screen Security */
